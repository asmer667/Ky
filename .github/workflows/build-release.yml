name: Build FUTO Keyboard (arm64)

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Install Git LFS and fetch submodule binaries
        shell: bash
        run: |
          set -euxo pipefail
          git lfs install --local
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule foreach --recursive 'git lfs install --local || true; git lfs pull || true'

      - name: Verify required FUTO dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "--- libs ---"
          find libs -maxdepth 2 -type f -printf '%p %s bytes\n' | sort || true
          echo "--- voice models ---"
          find voiceinput-shared/src/main/ml -maxdepth 2 -type f -printf '%p %s bytes\n' | head -50 || true
          echo "--- required AARs ---"
          test -f libs/mozc-release.aar
          test -f libs/rime-release.aar
          test -f libs/futo-swipe-release.aar
          test -f libs/vad-release.aar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK components
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Build stable release (arm64-v8a)
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleStableRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -path '*build/outputs/apk/*release/*.apk' -print -exec ls -lh {} \;
          APK_COUNT=$(find . -type f -path '*build/outputs/apk/*release/*.apk' | wc -l)
          test "$APK_COUNT" -ge 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futo-keyboard-arm64-release-${{ github.run_number }}
          path: '**/build/outputs/apk/*release/*.apk'
          if-no-files-found: error
