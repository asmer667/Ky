name: Build FUTO Keyboard (arm64)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Install Git LFS and fetch submodule binaries
        shell: bash
        run: |
          git lfs install --local || true
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
          git submodule foreach --recursive 'git lfs install --local || true; git lfs pull || true' || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK components
        shell: bash
        run: |
          set -x
          SDK_ROOT="$ANDROID_SDK_ROOT"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="$ANDROID_HOME"; fi
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="/usr/local/lib/android/sdk"; fi
          echo "SDK_ROOT=$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" --verbose

      - name: Verify AARs
        shell: bash
        run: |
          echo "=== libs folder contents ==="
          ls -la libs/
          echo ""
          echo "=== Checking required AARs ==="
          for f in vad-release.aar rime-release.aar futo-swipe-release.aar; do
            if [ -f "libs/$f" ]; then
              echo "✅ $f FOUND"
            else
              echo "❌ $f MISSING"
            fi
          done

      - name: Patch build.gradle to remove Mozc + fix includes
        shell: bash
        run: |
          echo "=== BEFORE ==="
          grep -n "mozc\|rime\|futo-swipe" build.gradle || true

          # احذف Mozc (ما عندناش)
          sed -i "/implementation(name:'mozc-release', ext:'aar')/d" build.gradle
          sed -i "/protobuf-javalite/d" build.gradle
          sed -i "/com.google.guava:guava/d" build.gradle

          echo "=== AFTER ==="
          grep -n "mozc\|rime\|futo-swipe" build.gradle || true

      - name: Delete Mozc-dependent source files
        shell: bash
        run: |
          # احذف الملفات اللي بتستخدم Mozc
          find java/src -name "JapaneseIME.kt" -delete 2>/dev/null || true
          find java/src -name "PersonalDictionaryJa.kt" -delete 2>/dev/null || true
          find java/src -name "ChineseIME.kt" -delete 2>/dev/null || true

          echo "=== Files that still reference mozc ==="
          grep -rl "org.mozc\|Mozc" java/src/ 2>/dev/null | head -20 || echo "none"

      - name: Build stable release (arm64-v8a)
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleStableRelease 2>&1 | tail -300

      - name: Find APK
        if: always()
        shell: bash
        run: |
          find . -name "*.apk" -path "*release*" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: futo-keyboard-arm64-release
          path: '**/build/outputs/apk/*release/*.apk'
          if-no-files-found: warn
