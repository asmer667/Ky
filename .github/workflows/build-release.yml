name: Build FUTO Keyboard (arm64)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Install Git LFS and fetch submodule binaries
        shell: bash
        run: |
          git lfs install --local || true
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
          git submodule foreach --recursive 'git lfs install --local || true; git lfs pull || true' || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK components
        shell: bash
        run: |
          set -x
          SDK_ROOT="$ANDROID_SDK_ROOT"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="$ANDROID_HOME"; fi
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="/usr/local/lib/android/sdk"; fi
          echo "SDK_ROOT=$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" --verbose

      - name: Patch build.gradle to remove missing AAR deps
        shell: bash
        run: |
          echo "--- BEFORE ---"
          grep -n "mozc\|rime\|futo-swipe" build.gradle || true

          sed -i "/implementation(name:'mozc-release', ext:'aar')/d" build.gradle
          sed -i "/implementation files('libs\/rime-release.aar')/d" build.gradle
          sed -i "/implementation files('libs\/futo-swipe-release.aar')/d" build.gradle

          echo "--- AFTER ---"
          grep -n "mozc\|rime\|futo-swipe" build.gradle || echo "None"

      - name: Build stable release (arm64-v8a)
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleStableRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: futo-keyboard-arm64-release-${{ github.run_number }}
          path: '**/build/outputs/apk/*release/*.apk'
          if-no-files-found: warn
