name: Build FUTO AARs (Rime + Mozc + Swipe)

on:
  workflow_dispatch:

jobs:
  build-rime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RimeJni (recursive)
        run: |
          git clone --recursive --depth 1 https://gitlab.futo.org/keyboard/RimeJni.git rime-source
          cd rime-source
          git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK/NDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" || true

      - name: Build Rime AAR
        run: |
          cd rime-source
          chmod +x gradlew
          ./gradlew :rime:assembleRelease --stacktrace

      - name: Upload Rime AAR
        uses: actions/upload-artifact@v4
        with:
          name: rime-aar
          path: rime-source/rime/build/outputs/aar/*.aar
          if-no-files-found: warn

  build-mozc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mozc-lib (recursive)
        run: |
          git clone --recursive --depth 1 https://gitlab.futo.org/keyboard/mozc-lib.git mozc-source
          cd mozc-source
          git submodule update --init --recursive

      - name: Apply patches
        run: |
          cd mozc-source
          if [ -f patches.diff ]; then
            cd third_party/mozc
            git apply ../../patches.diff 2>&1 || echo "patches might already be applied"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK/NDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358" || true

      - name: Build Mozc AAR
        run: |
          cd mozc-source
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload Mozc AAR
        uses: actions/upload-artifact@v4
        with:
          name: mozc-aar
          path: mozc-source/build/outputs/aar/*.aar
          if-no-files-found: warn

  build-swipe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout swipe-library (recursive)
        run: |
          git clone --recursive --depth 1 https://gitlab.futo.org/keyboard/swipe-library.git swipe-source
          cd swipe-source
          git submodule update --init --recursive 2>&1 || echo "submodule update failed (executorch is huge)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK/NDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" || true

      - name: Inspect swipe android folder
        run: |
          cd swipe-source/android
          echo "=== build.gradle.kts ==="
          cat build.gradle.kts
          echo ""
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts

      - name: Build Swipe AAR
        run: |
          cd swipe-source/android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload Swipe AAR
        uses: actions/upload-artifact@v4
        with:
          name: swipe-aar
          path: swipe-source/android/**/build/outputs/aar/*.aar
          if-no-files-found: warn
