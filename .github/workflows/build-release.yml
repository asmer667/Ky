name: Build VAD AAR

on:
  workflow_dispatch:

jobs:
  build-vad:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout VAD source
        uses: actions/checkout@v4
        with:
          repository: abb128/android-vad
          path: vad-source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Explore repo structure
        run: |
          cd vad-source
          echo "=== Root files ==="
          ls -la
          echo "=== settings.gradle ==="
          cat settings.gradle 2>/dev/null || echo "not found"
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts 2>/dev/null || echo "not found"
          echo "=== All modules ==="
          find . -name "build.gradle" -o -name "build.gradle.kts" | head -20

      - name: Build VAD AAR
        run: |
          cd vad-source
          chmod +x gradlew
          ./gradlew :vad:assembleRelease --stacktrace 2>&1 || \
          ./gradlew assembleRelease --stacktrace 2>&1 || \
          ./gradlew :library:assembleRelease --stacktrace 2>&1 || \
          ./gradlew tasks --all 2>&1 | head -100

      - name: Find AAR
        if: success()
        run: |
          mkdir -p output
          find vad-source -name "*.aar" -path "*release*" -exec cp {} output/vad-release.aar \;
          find vad-source -name "*.aar" -exec cp {} output/ \;
          ls -la output/

      - name: Upload VAD AAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vad-release-aar
          path: output/*.aar
